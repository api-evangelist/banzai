aid: banzai
name: Banzai
description: >-
  Banzai International, Inc. (NASDAQ: BNZI) is a Seattle-area marketing technology
  company that builds AI-enabled engagement, video and event marketing software for
  B2B marketing and sales teams. Its portfolio includes Demio (webinar and virtual
  event platform), Boost, Curate, Vidello, OpenReel, CreateStudio, PhotoVibrance and
  Twinkle, alongside Act-On Software. The public developer surface Banzai publishes
  is the Public Demio API — a key/secret authorized REST API at
  https://my.demio.com/api/v1 covering Events, Event Sessions (Dates), attendee
  registration with unique join links, and session participation reporting. Demio
  documents the API as an Apiary API Blueprint, publishes rate limits and daily call
  quotas, runs a public Statuspage, and offers a Zapier app with registration,
  attendance and no-show triggers for teams that do not want to call the API
  directly. Banzai went public via SPAC in December 2023 and was surfaced to the API
  Evangelist network through the secondary-market harvest backlog.
