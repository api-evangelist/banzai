api: Public Demio API
description: >-
  Demio's contract distinguishes sandbox credentials from live credentials, but the
  provider publishes no self-serve way to obtain them and no test fixtures. Recorded
  here because the distinction is visible in the published contract, not because a
  documented sandbox programme exists.
test_live_separation:
  supported: true
  mechanism: separate key/secret pair
  signal:
    operation: pingViaHeaders
    field: sandbox
    type: boolean
    meaning: True when the request was authorized with a sandbox key/secret.
    source: openapi/banzai-demio-openapi.yml#pingViaHeaders
  key_prefixes: none
  note: >-
    Demio API keys and secrets carry no live/test prefix — the only way to tell which
    mode a credential is in is to call GET /ping and read the `sandbox` flag.
obtaining_credentials:
  self_serve: false
  documented_procedure: null
  note: >-
    Neither the API Blueprint nor the Help Center documents how to request sandbox
    credentials. The Settings > API tab (https://my.demio.com/manage/api-details)
    issues one key/secret pair per account and reports daily usage; it is not
    documented as issuing sandbox pairs.
mock_server:
  provider: Apiary
  url: https://publicdemioapi.apiary-mock.com/api/v1/
  first_party: false
  note: >-
    Apiary generates a mock server from any published blueprint. It is a docs-platform
    feature, not a Demio-operated sandbox, and it returns the blueprint's example
    payloads rather than account data.
test_values:
  cards: null
  identifiers: null
  note: >-
    No magic test identifiers, test Events, seeded registrants or trigger values are
    published. There is no test-clock or time-simulation facility.
free_trial:
  url: https://www.demio.com/free-trial
  api_quota: 100 calls per day
  note: >-
    The closest thing to a self-serve evaluation path is the free trial, which carries
    a 100 call/day API quota against a real account.
